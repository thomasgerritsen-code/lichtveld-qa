name: LINAC simulator tests

on:
  pull_request:
    paths:
      - 'linac-simulator/**'
      - '.github/workflows/linac-simulator-tests.yml'
  push:
    branches: [ main ]
    paths:
      - 'linac-simulator/**'
      - '.github/workflows/linac-simulator-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run simulator regression tests
        run: npm test --prefix linac-simulator
